name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is not tested: dev-only vitest 4 requires ^20 || ^22 || >=24,
        # even though package.json engines still says >=18. See the Node
        # engines follow-up in docs/plans/provider-refresh-and-ci-gate.md.
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # dist/ is committed and regenerated by the pre-commit hook. Rebuild
      # from an empty dist/ so modified, missing (new source never built),
      # and orphaned (source deleted, output left behind) files all show up.
      # tsc output depends on the locked TypeScript version, not Node, so
      # this runs on every leg.
      - name: Check committed dist/ matches source
        run: |
          rm -rf dist
          npm run build
          status="$(git status --porcelain -- dist/)"
          if [ -n "$status" ]; then
            echo "dist/ is out of sync with src/. Run 'npm run build' and commit dist/."
            echo "$status"
            exit 1
          fi
